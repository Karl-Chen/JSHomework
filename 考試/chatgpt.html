<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 定義身高和體重的陣列
        const heights = [170, 165, 180]; // 身高以公分為單位
        const weights = [65, 60, 75]; // 體重以公斤為單位
        var minBMI = 9999;
        function calBMI(height, weight) {
            return weight / (height / 100 * height / 100);
        }
        for (var i in heights) {
            var bmi = weight / (height / 100 * height / 100);//calBMI(heights[i], weights[i]);
            if (minBMI > bmi)
                minBMI = bmi;
        }
        minBMI = parseInt(minBMI);
        var level = "正常";
        if (minBMI > 25)
            level = "過胖";
        else if (minBMI < 18)
            level = "過廋";
        document.write(`最小值為${minBMI}，BMI為${level}`);

        document.write("<hr>");
        //-------------------------------------------
        // 定義兩個整數變數
        let num1 = 12; // 第一個整數
        let num2 = 18; // 第二個整數
        var minNum = num1;
        if (minNum > num2)
            minNum = num2;

        while (minNum > 0 && (num1 % minNum != 0 || num2 % minNum != 0))
            minNum--;
        document.write(`${num1}與${num2}的最大公因數為${minNum}`);


    </script>
</body>

</html>
